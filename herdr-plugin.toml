id = "herdr-archive"
name = "Herdr Archive"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "tmux-resurrect for herdr: capture, archive, and env-faithfully resume sessions, workspaces, and agents."
platforms = ["macos", "linux"]

# plugin link does not run build commands; local authors build themselves.
[[build]]
command = ["go", "build", "-o", "bin/herdr-archive", "."]

[[actions]]
id = "ping"
title = "herdr-archive smoke test (dump plugin context)"
contexts = ["global"]
command = ["./bin/herdr-archive", "action", "ping"]

[[actions]]
id = "open-browser"
title = "Open Herdr Archive"
description = "Open the session archive and additive restoration planner."
contexts = ["global"]
command = ["bash", "scripts/open-browser.sh"]

# The interactive browser. Opens as a session-modal popup; closes when the
# TUI exits. Also available as a plain verb: `herdr-archive browse`.
[[panes]]
id = "browser"
title = "herdr-archive"
placement = "popup"
width = "80%"
height = 24
command = ["./bin/herdr-archive", "browse"]
