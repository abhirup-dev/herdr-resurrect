id = "herdr-resurrect"
name = "Herdr Resurrect"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "tmux-resurrect for herdr: capture, archive, and env-faithfully resume sessions, workspaces, and agents."
platforms = ["macos", "linux"]

# plugin link does not run build commands; local authors build themselves.
[[build]]
command = ["go", "build", "-o", "bin/herdr-resurrect", "."]

[[actions]]
id = "ping"
title = "herdr-resurrect smoke test (dump plugin context)"
contexts = ["global"]
command = ["./bin/herdr-resurrect", "action", "ping"]

[[actions]]
id = "open-browser"
title = "Open Herdr Resurrect"
description = "Open the session archive and additive restoration planner."
contexts = ["global"]
command = ["bash", "scripts/open-browser.sh"]

[[actions]]
id = "stop-current"
title = "Capture and Stop Current Session"
description = "Capture the invoking session, preview the stopped topology, then ask for confirmation."
contexts = ["global"]
command = ["bash", "scripts/open-stop.sh"]

# The interactive browser. Opens as a session-modal popup; closes when the
# TUI exits. Also available as a plain verb: `herdr-resurrect browse`.
[[panes]]
id = "browser"
title = "herdr-resurrect"
placement = "popup"
width = "90%"
height = "80%"
command = ["./bin/herdr-resurrect", "browse"]

[[panes]]
id = "stop-current"
title = "capture & stop session"
placement = "popup"
width = "90%"
height = "80%"
command = ["./bin/herdr-resurrect", "browse", "--stop-current"]
